name: Build CatEngine APKs and AARs

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: CatEngine-Debug-APKs
          path: ./app/build/outputs/apk/debug/*.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: CatEngine-Release-APKs
          path: ./app/build/outputs/apk/release/*.apk

      - name: Upload Core AARs
        uses: actions/upload-artifact@v4
        with:
          name: CatEngine-Core-AARs
          path: ./Bcore/build/outputs/aar/*.aar
